name: Validar dados do guia

on:
  push:
    paths: ['assets/data.json', 'scripts/validate.mjs', '.github/workflows/validate.yml']
  pull_request:
    paths: ['assets/data.json', 'scripts/validate.mjs', '.github/workflows/validate.yml']
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/validate.mjs
