<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nin Help — Pergaminho do Leveling</title>
<meta name="description" content="Guia de leveling do Nin Online do nível 1 ao 70: onde farmar, missões e dicas de build por vila e maestria.">
<meta name="theme-color" content="#0a0f17">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='4' y='2' width='24' height='28' rx='4' fill='%23ead9ad' stroke='%233b2814' stroke-width='2'/%3E%3Crect x='2' y='2' width='28' height='5' rx='2.5' fill='%2374c23a'/%3E%3Crect x='2' y='25' width='28' height='5' rx='2.5' fill='%2374c23a'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<main class="page">
  <div class="layout">

    <section class="scroll" aria-labelledby="title">
      <div class="rod"><span></span><span></span></div>
      <div class="scroll-body">
        <div class="edge"></div>
        <div class="paper">

          <div class="lang" role="group" id="lang-group">
            <button type="button" class="flag" data-lang="en" aria-label="English" title="English">
              <svg width="34" height="22" viewBox="0 0 38 24" aria-hidden="true"><rect width="38" height="24" fill="#b22234"/><path d="M0 2.77h38M0 6.46h38M0 10.15h38M0 13.85h38M0 17.54h38M0 21.23h38" stroke="#fff" stroke-width="1.85"/><rect width="16" height="12.9" fill="#3c3b6e"/><path d="M2 2.2h.01M5.2 2.2h.01M8.4 2.2h.01M11.6 2.2h.01M14 2.2h.01M3.6 4.6h.01M6.8 4.6h.01M10 4.6h.01M13.2 4.6h.01M2 7h.01M5.2 7h.01M8.4 7h.01M11.6 7h.01M14 7h.01M3.6 9.4h.01M6.8 9.4h.01M10 9.4h.01M13.2 9.4h.01M2 11.6h.01M5.2 11.6h.01M8.4 11.6h.01M11.6 11.6h.01M14 11.6h.01" stroke="#fff" stroke-width="1.1" stroke-linecap="round"/></svg>
            </button>
            <button type="button" class="flag" data-lang="pt" aria-label="Português (Brasil)" title="Português (Brasil)">
              <svg width="34" height="22" viewBox="0 0 38 24" aria-hidden="true"><rect width="38" height="24" fill="#009c3b"/><path d="M19 2.5L35 12 19 21.5 3 12z" fill="#ffdf00"/><circle cx="19" cy="12" r="5.6" fill="#002776"/><path d="M13.6 10.9c3.6-.6 7.4.1 10.6 2" stroke="#fff" stroke-width="1" fill="none"/></svg>
            </button>
          </div>

          <header class="head">
            <h1 id="title" data-t="title"></h1>
            <p data-t="subtitle"></p>
          </header>

          <div class="field">
            <div class="label" data-t="village" id="village-label"></div>
            <div class="villages" id="villages" role="group" aria-labelledby="village-label"></div>
          </div>

          <div class="field">
            <div class="label" data-t="mastery" id="mastery-label"></div>
            <div class="masteries" id="masteries" role="group" aria-labelledby="mastery-label"></div>
          </div>

          <div class="dash"></div>

          <div class="path">
            <div class="path-title"><span></span><strong data-t="path"></strong><span></span></div>
            <div class="caption" id="caption" aria-live="polite"></div>

            <div class="track-wrap">
              <div class="brackets" id="brackets"></div>
              <div class="track">
                <div class="track-line"></div>
                <div class="track-fill" id="fill"></div>
                <div class="diamond top"></div>
                <div class="diamond bottom"></div>
                <div id="ticks"></div>
                <div class="seal" id="seal" hidden><span>NV</span><b id="seal-lv"></b></div>
                <input class="lvl-range" id="range" type="range" min="1" max="70" step="1" value="1">
              </div>
              <div class="milestones" id="milestones"></div>
            </div>
          </div>

          <p class="footer"><span data-t="footer"></span><br><a id="suggest-general" href="#" target="_blank" rel="noopener" data-t="suggestGeneral"></a></p>
        </div>
        <div class="edge"></div>
      </div>
      <div class="rod"><span></span><span></span></div>
    </section>

    <div class="sheet-backdrop" id="backdrop" hidden></div>
    <aside class="details" id="details" hidden>
      <div class="sheet-grip" aria-hidden="true"></div>
      <div class="d-head" id="d-head">
        <div class="d-seal"><span data-t="levelCaps"></span><b id="d-level"></b></div>
        <div class="d-title">
          <div class="d-tag" id="d-tag"></div>
          <div class="d-range" id="d-range"></div>
          <div class="d-peek sheet-only" id="d-peek"></div>
        </div>
        <button type="button" class="icon-btn sheet-only" id="sheet-toggle" aria-expanded="false" aria-controls="details"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg></button>
        <button type="button" class="icon-btn" id="close"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>

      <div class="d-nav">
        <button type="button" id="prev" data-t="prev"></button>
        <button type="button" id="next" data-t="next"></button>
      </div>

      <div class="d-sec">
        <div class="d-label" data-t="where"></div>
        <div class="d-mob">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#f0a93c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>
          <span id="s-mob"></span>
        </div>
        <div class="d-zone">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/></svg>
          <span id="s-zone"></span>
        </div>
        <p class="d-text" id="s-how"></p>
        <div class="d-box alt" id="alt" hidden>
          <span class="d-label" data-t="alt"></span>
          <span class="alt-line"><span id="alt-mob"></span> <span class="muted">· <span id="alt-zone"></span></span></span>
        </div>
        <a class="map-link" id="map-link" href="#" target="_blank" rel="noopener" hidden>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6"/><path d="M20 4l-9 9"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>
          <span data-t="openMap"></span>
        </a>
      </div>

      <div class="d-sec">
        <div class="d-label" data-t="missions"></div>
        <div id="m-now" class="m-list"></div>
        <span class="muted" id="m-none" data-t="noMissions" hidden></span>
        <div class="d-label soon" data-t="soon"></div>
        <div id="m-soon" class="m-list"></div>
      </div>

      <div class="d-sec">
        <div class="d-label" data-t="build"></div>
        <div class="d-build">
          <span class="dot" id="b-dot"></span>
          <strong id="b-name"></strong>
          <span class="muted" id="b-village"></span>
        </div>
        <p class="d-text" id="b-tip"></p>
        <div class="d-box" id="b-note"></div>
        <div class="d-box"><strong id="v-name"></strong> <span id="v-note"></span></div>
      </div>

      <div class="next-box">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 21V4h11l-2 4 2 4H5"/></svg>
        <span id="next-text"></span>
      </div>

      <a class="suggest-link" id="suggest" href="#" target="_blank" rel="noopener">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
        <span data-t="suggest"></span>
      </a>
    </aside>

  </div>
</main>
<script src="assets/app.js"></script>
</body>
</html>
